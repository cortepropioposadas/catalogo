<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | CortePropio</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">CORTE<span>PROPIO</span></div>
        <div style="font-size: 0.9rem; font-weight: 500;">Grabado láser personalizado • Posadas</div>
    </header>

    <div class="layout-grid">
        <!-- COLUMNA LATERAL: FILTROS -->
        <aside class="sidebar">
            <div class="filter-group" id="contenedor-filtros-tematica">
                <h3>Filtrar por Temática</h3>
                <label class="filter-option">
                    <input type="radio" name="tematica" value="todas" checked onchange="aplicarFiltros()"> Todas
                </label>
            </div>

            <div class="filter-group">
                <h3>Filtrar por Precio (Unidad)</h3>
                <label class="filter-option">
                    <input type="radio" name="precio" value="todos" checked onchange="aplicarFiltros()"> Todos los precios
                </label>
                <label class="filter-option">
                    <input type="radio" name="precio" value="bajo" onchange="aplicarFiltros()"> Menos de 5€
                </label>
                <label class="filter-option">
                    <input type="radio" name="precio" value="medio" onchange="aplicarFiltros()"> De 5€ a 15€
                </label>
                <label class="filter-option">
                    <input type="radio" name="precio" value="alto" onchange="aplicarFiltros()"> Más de 15€
                </label>
            </div>
        </aside>

        <!-- COLUMNA PRINCIPAL: CATÁLOGO -->
        <main class="productos-grid" id="contenedor-productos">
            <!-- Los productos se cargan aquí mediante JavaScript -->
        </main>
    </div>

    <div id="image-modal" class="modal-oculto" onclick="cerrarModal()">
        <span class="cerrar-modal">&times;</span>
        <img id="modal-img" src="" alt="Imagen ampliada">
    </div>  
    
    <script src="js/productos.js"></script>
    <script src="js/app.js"></script>
    
</body>
</html>
