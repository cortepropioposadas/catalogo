<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | CortePropio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">cortepropio</div>
        <p class="tagline">Grabado láser personalizado • Posadas, Córdoba</p>
    </header>

    <div class="container-main">
        <aside class="sidebar">
            <h3>Categorías</h3>
            <ul class="filter-list">
                <li><button class="active" onclick="filtrar('todos')">Todos los productos</button></li>
                <li><button onclick="filtrar('llaveros')">Llaveros</button></li>
                <li><button onclick="filtrar('eventos')">Eventos y Bodas</button></li>
                <li><button onclick="filtrar('regalos')">Regalos Especiales</button></li>
                <li><button onclick="filtrar('decoracion')">Decoración</button></li>
            </ul>
            
            <div class="banner-dm">
                <h4>¿Buscas algo a medida?</h4>
                <p>Escríbenos por Instagram y diseñamos tu idea desde cero.</p>
                <a href="https://ig.me/m/cortepropio" class="btn-sidebar">Enviar DM</a>
            </div>
        </aside>

        <main class="content">
            <div class="grid-productos" id="grid-productos">
                </div>
        </main>
    </div>

    <section class="features">
        <div class="feature-item"><span>📦</span> Envíos a toda España</div>
        <div class="feature-item"><span>🎨</span> Diseños 100% únicos</div>
        <div class="feature-item"><span>💬</span> Atención personalizada</div>
    </section>

    <script src="app.js"></script>
</body>
</html>
